<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>게시글 수정</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      margin-top: 60px;
      background: #ffffff;
      padding: 32px 36px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      width: 520px;
      box-sizing: border-box;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      color: #222;
    }

    .actions-header {
      display: flex;
      gap: 8px;
    }

    a.button-link {
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.05s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #e5e7eb;
      color: #374151;
    }

    a.button-link:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d0d0d7;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: vertical;
      min-height: 120px;
    }

    input[type="text"] {
      min-height: auto;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    .actions {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.05s, box-shadow 0.2s;
    }

    button:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    #saveBtn {
      background-color: #2563eb;
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    #saveBtn:disabled {
      background-color: #9ca3af;
      box-shadow: none;
      cursor: default;
    }

    #cancelBtn {
      background-color: #e5e7eb;
      color: #374151;
    }

    .message {
      margin-top: 16px;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      display: none;
      white-space: pre-line;
    }

    .message.info {
      background-color: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .message.success {
      background-color: #ecfdf3;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .message.error {
      background-color: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .field-error {
      font-size: 12px;
      color: #b91c1c;
      margin-top: 4px;
      display: none;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>게시글 수정</h1>
    <div class="actions-header">
      <a href="/posts.html" class="button-link">목록으로</a>
    </div>
  </header>

  <div id="infoMessage" class="message info"></div>
  <div id="successMessage" class="message success"></div>
  <div id="errorMessage" class="message error"></div>

  <form id="editForm">
    <div class="form-group">
      <label for="title">제목 (title)</label>
      <input type="text" id="title" name="title" placeholder="제목을 입력하세요" />
      <div id="titleError" class="field-error">제목은 필수입니다.</div>
    </div>

    <div class="form-group">
      <label for="content">내용 (content)</label>
      <textarea id="content" name="content" placeholder="내용을 입력하세요"></textarea>
      <div id="contentError" class="field-error">내용은 필수입니다.</div>
    </div>

    <div class="actions">
      <button type="button" id="cancelBtn">취소</button>
      <button type="submit" id="saveBtn">저장</button>
    </div>
  </form>
</div>

<script>
  const infoMessage = document.getElementById('infoMessage');
  const successMessage = document.getElementById('successMessage');
  const errorMessage = document.getElementById('errorMessage');
  const editForm = document.getElementById('editForm');
  const titleInput = document.getElementById('title');
  const contentInput = document.getElementById('content');
  const titleError = document.getElementById('titleError');
  const contentError = document.getElementById('contentError');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');

  function showMessage(el, text) {
    el.textContent = text;
    el.style.display = 'block';
  }

  function hideMessage(el) {
    el.style.display = 'none';
    el.textContent = '';
  }

  function clearAllMessages() {
    hideMessage(infoMessage);
    hideMessage(successMessage);
    hideMessage(errorMessage);
  }

  function clearFieldErrors() {
    titleError.style.display = 'none';
    contentError.style.display = 'none';
    titleError.textContent = '제목은 필수입니다.';
    contentError.textContent = '내용은 필수입니다.';
  }

  function getPostIdFromQuery() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id');
  }

  async function loadPost(id) {
    clearAllMessages();
    clearFieldErrors();

    if (!id) {
      showMessage(errorMessage, '잘못된 접근입니다. 게시글 ID가 필요합니다.');
      saveBtn.disabled = true;
      return;
    }

    showMessage(infoMessage, '게시글 정보를 불러오는 중입니다...');

    try {
      const response = await fetch('/api/posts/' + encodeURIComponent(id), {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
      });

      if (!response.ok) {
        if (response.status === 404) {
          throw new Error('해당 ID의 게시글을 찾을 수 없습니다.');
        }
        throw new Error('게시글 정보를 불러오지 못했습니다. (status: ' + response.status + ')');
      }

      const data = await response.json();
      titleInput.value = data.title || '';
      contentInput.value = data.content || '';

      hideMessage(infoMessage);
    } catch (e) {
      console.error('게시글 로딩 실패:', e);
      hideMessage(infoMessage);
      showMessage(errorMessage, e.message || '게시글 정보를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');
      saveBtn.disabled = true;
    }
  }

  async function updatePost(id, title, content) {
    const response = await fetch('/api/posts/' + encodeURIComponent(id), {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({ title, content })
    });

    const contentType = response.headers.get('Content-Type') || '';
    let body = null;
    if (contentType.includes('application/json')) {
      body = await response.json().catch(() => null);
    } else {
      body = await response.text().catch(() => null);
    }

    if (!response.ok) {
      throw { status: response.status, body };
    }

    return body;
  }

  editForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearAllMessages();
    clearFieldErrors();

    const id = getPostIdFromQuery();
    if (!id) {
      showMessage(errorMessage, '잘못된 접근입니다. 게시글 ID가 필요합니다.');
      return;
    }

    const title = titleInput.value.trim();
    const content = contentInput.value.trim();

    let hasError = false;
    if (!title) {
      titleError.style.display = 'block';
      hasError = true;
    }
    if (!content) {
      contentError.style.display = 'block';
      hasError = true;
    }
    if (hasError) {
      showMessage(errorMessage, '필수 항목을 입력해주세요.');
      return;
    }

    saveBtn.disabled = true;
    showMessage(infoMessage, '게시글을 수정하는 중입니다...');

    try {
      const result = await updatePost(id, title, content);
      hideMessage(infoMessage);
      const idText = result && typeof result.id !== 'undefined'
        ? ' (id: ' + result.id + ')'
        : '';
      showMessage(successMessage, '게시글이 성공적으로 수정되었습니다.' + idText);
    } catch (err) {
      console.error('게시글 수정 실패:', err);
      hideMessage(infoMessage);

      let message = '게시글 수정에 실패했습니다. 잠시 후 다시 시도해주세요.';

      if (err && err.status === 404) {
        message = '해당 게시글을 찾을 수 없습니다.';
      } else if (err && err.status === 400 && err.body) {
        // 서버 Validation 응답(ErrorResponse)을 반영
        if (typeof err.body === 'object' && Array.isArray(err.body.errors)) {
          err.body.errors.forEach(e => {
            if (e.field === 'title') {
              titleError.textContent = e.message || '제목은 필수입니다.';
              titleError.style.display = 'block';
            }
            if (e.field === 'content') {
              contentError.textContent = e.message || '내용은 필수입니다.';
              contentError.style.display = 'block';
            }
          });
          message = err.body.message || message;
        } else if (typeof err.body === 'string') {
          message = err.body;
        } else if (err.body && err.body.message) {
          message = err.body.message;
        }
      }

      showMessage(errorMessage, message);
    } finally {
      saveBtn.disabled = false;
    }
  });

  cancelBtn.addEventListener('click', () => {
    const id = getPostIdFromQuery();
    if (id) {
      window.location.href = '/post-detail.html?id=' + encodeURIComponent(id);
    } else {
      window.location.href = '/posts.html';
    }
  });

  window.addEventListener('DOMContentLoaded', () => {
    const id = getPostIdFromQuery();
    loadPost(id);
  });
</script>
</body>
</html>
