<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 수정</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <nav class="nav-link"><a href="/post-list.html">목록</a></nav>
        <h1>게시글 수정</h1>
        <div id="editLoading" class="loading">불러오는 중...</div>
        <form id="postEditForm" class="post-form" hidden>
            <input type="hidden" id="postId" name="id">
            <div class="field">
                <label for="title">제목</label>
                <input type="text" id="title" name="title" required maxlength="500" placeholder="제목을 입력하세요" aria-describedby="titleError">
                <span id="titleError" class="field-error" aria-live="polite"></span>
            </div>
            <div class="field">
                <label for="content">내용</label>
                <textarea id="content" name="content" rows="6" required placeholder="내용을 입력하세요" aria-describedby="contentError"></textarea>
                <span id="contentError" class="field-error" aria-live="polite"></span>
            </div>
            <button type="submit" class="btn">수정</button>
        </form>
        <div id="message" class="message" aria-live="polite"></div>
    </div>
    <script src="/js/post-edit.js"></script>
</body>
</html>
