<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>게시글 목록</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      margin-top: 40px;
      background: #ffffff;
      padding: 24px 28px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      width: 680px;
      box-sizing: border-box;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      color: #222;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button, a.button-link {
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.05s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:active,
    a.button-link:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .primary {
      background-color: #2563eb;
      color: white;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.32);
    }

    .secondary {
      background-color: #e5e7eb;
      color: #374151;
    }

    .message {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: none;
    }

    .message.info {
      background-color: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .message.error {
      background-color: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    ul.post-list {
      list-style: none;
      padding: 0;
      margin: 8px 0 0;
    }

    .post-item {
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      padding: 12px 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s, box-shadow 0.15s;
      background-color: #fff;
    }

    .post-item:hover {
      background-color: #f9fafb;
      border-color: #d1d5db;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .post-title {
      font-size: 15px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 4px;
    }

    .post-content {
      font-size: 13px;
      color: #4b5563;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-text {
      font-size: 14px;
      color: #6b7280;
      margin-top: 12px;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>게시글 목록</h1>
    <div class="actions">
      <a href="/post-create.html" class="button-link primary">새 글 작성</a>
    </div>
  </header>

  <div id="infoMessage" class="message info"></div>
  <div id="errorMessage" class="message error"></div>

  <ul id="postList" class="post-list"></ul>
  <div id="emptyText" class="empty-text" style="display: none;">등록된 게시글이 없습니다.</div>
</div>

<script>
  const postList = document.getElementById('postList');
  const emptyText = document.getElementById('emptyText');
  const infoMessage = document.getElementById('infoMessage');
  const errorMessage = document.getElementById('errorMessage');

  function showInfo(text) {
    infoMessage.textContent = text;
    infoMessage.style.display = 'block';
  }

  function hideInfo() {
    infoMessage.style.display = 'none';
    infoMessage.textContent = '';
  }

  function showError(text) {
    errorMessage.textContent = text;
    errorMessage.style.display = 'block';
  }

  function hideError() {
    errorMessage.style.display = 'none';
    errorMessage.textContent = '';
  }

  function renderPosts(posts) {
    postList.innerHTML = '';
    if (!posts || posts.length === 0) {
      emptyText.style.display = 'block';
      return;
    }

    emptyText.style.display = 'none';

    posts.forEach(post => {
      const li = document.createElement('li');
      li.className = 'post-item';
      li.addEventListener('click', () => {
        window.location.href = '/post-detail.html?id=' + encodeURIComponent(post.id);
      });

      const title = document.createElement('div');
      title.className = 'post-title';
      title.textContent = post.title;

      const content = document.createElement('div');
      content.className = 'post-content';
      content.textContent = post.content;

      li.appendChild(title);
      li.appendChild(content);
      postList.appendChild(li);
    });
  }

  async function fetchPosts() {
    hideInfo();
    hideError();
    showInfo('게시글 목록을 불러오는 중입니다...');

    try {
      const response = await fetch('/api/posts', {
        method: 'GET',
        headers: {
          'Accept': 'application/json'
        }
      });

      if (!response.ok) {
        throw new Error('서버 오류가 발생했습니다. (status: ' + response.status + ')');
      }

      const data = await response.json();
      hideInfo();
      renderPosts(data);
    } catch (e) {
      console.error('목록 조회 실패:', e);
      hideInfo();
      renderPosts([]);
      showError('게시글 목록을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');
    }
  }

  window.addEventListener('DOMContentLoaded', fetchPosts);
</script>
</body>
</html>
